name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate skills and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Count skills
        run: |
          TOTAL=$(ls -d skills/*/ 2>/dev/null | wc -l)
          echo "Total skills: $TOTAL"
          ls -d skills/*/

      - name: Validate skill frontmatter
        run: |
          ERRORS=0
          for dir in skills/*/; do
            SKILL_FILE="${dir}SKILL.md"
            if [ ! -f "$SKILL_FILE" ]; then
              echo "::error::Missing SKILL.md in $dir"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check frontmatter exists
            if ! head -1 "$SKILL_FILE" | grep -q '^---'; then
              echo "::error file=$SKILL_FILE::Missing frontmatter"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check required fields
            FRONTMATTER=$(sed -n '1,/^---$/p' "$SKILL_FILE" | tail -n +2)
            for field in name description; do
              if ! echo "$FRONTMATTER" | grep -q "^${field}:"; then
                echo "::error file=$SKILL_FILE::Missing required field: $field"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS validation error(s) found"
            exit 1
          fi
          echo "All skills validated successfully"

      - name: Check skill bodies for argument placeholders
        run: |
          # Claude Code 带参数调用 skill 时，会把 SKILL.md 正文里的 $0-$9 / $ARGUMENTS
          # 替换成参数（如 awk '{print $1}' 变成 awk '{print 2}'）。示例改用 ${1}、cut、? 占位符等。
          if grep -nE '\$([0-9]|ARGUMENTS)' skills/*/SKILL.md; then
            echo "::error::SKILL.md 正文含会被参数替换的占位符（见上）"
            exit 1
          fi
          echo "No argument placeholders in skill bodies"

      - name: Check skill size budget
        run: |
          node --test tests/skill-size/test-boundaries.mjs
          bash tests/skill-size/test-skill-size.sh
          bash tests/skill-layout/test-no-dev-files-in-skills.sh

      - name: Check package.json
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
            const required = ['name', 'version', 'description', 'license'];
            const missing = required.filter(f => !pkg[f]);
            if (missing.length) {
              console.error('Missing package.json fields:', missing.join(', '));
              process.exit(1);
            }
            console.log('package.json OK:', pkg.name, 'v' + pkg.version);
          "

      - name: Validate install script
        run: node bin/superpowers-zh.js --help

      - name: Check release metadata versions
        run: |
          # 旧版 bash 发版路径依赖 jq；CI 不允许静默跳过这项集成测试。
          jq --version
          node --test tests/versioning/test-release-versions.mjs
          node scripts/sync-plugin-version.js --check

      - name: Test plan bookkeeping and workspace protection
        run: |
          node --test tests/installer/test-task-brief.mjs
          bash tests/claude-code/test-executing-plans-scripts.sh
          bash tests/claude-code/test-sdd-workspace.sh

      - name: Test SessionStart hook
        run: bash tests/hooks/test-session-start.sh

      - name: Test OpenCode bootstrap and skill registration
        run: |
          bash tests/opencode/test-bootstrap-caching.sh
          bash tests/opencode/test-session-bootstrap.sh
          bash tests/opencode/test-skill-registration.sh
          bash tests/opencode/test-hook-registration.sh

      - name: Test shell lint utility
        run: bash tests/shell-lint/test-lint-shell.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test native plugin channels and publishing sync
        env:
          TZ: Asia/Shanghai
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q tests/hermes
          node --test tests/native/test-manifest-contracts.mjs
          bash tests/antigravity/run-tests.sh
          bash tests/devin/test-devin-plugin.sh
          bash tests/codex-plugin-sync/test-sync-to-codex-plugin.sh
          bash tests/codex/test-package-codex-plugin.sh

      - name: Test brainstorm server
        working-directory: tests/brainstorm-server
        run: |
          node --test project-path.test.mjs
          npm ci
          npm test

      - name: Verify installer lifecycle
        run: bash scripts/verify-release.sh --offline

      - name: Verify installer argument validation
        run: node --test tests/installer/test-arguments.mjs tests/installer/test-codebuddy-bootstrap.mjs tests/installer/test-bootstrap-uninstall.mjs

      - name: Verify packed installer and installed helpers
        run: node --test tests/installer/test-packed-package.mjs

      - name: Build site
        run: node site/build.mjs

  pi:
    name: Pi extension contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash tests/pi/run-tests.sh

  hooks-windows:
    # run-hook.cmd 的 cmd 半边只能在 Windows 上验证：查找 bash 的顺序、跳过 WSL 启动器、
    # 不执行当前目录下的同名程序、hook 退出码不丢失。runner 自带 Program Files 下的
    # Git for Windows，正好满足测试前提；shell: bash 即 Git Bash。
    name: Hooks on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # runner 默认 TEMP 是 8.3 短路径（C:\Users\RUNNER~1\...），测试把 LOCALAPPDATA 指到
      # mktemp 目录下，where 返回的长路径与短路径字符串比较对不上，会误报 WindowsApps 用例。
      # 真实机器上 PATH 里的 WindowsApps 由同一个 LOCALAPPDATA 展开，不存在这种不一致。
      - name: Test run-hook.cmd (cmd half)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          echo "default TEMP: $(cmd //c echo %TEMP%)  TMPDIR: $TMPDIR"
          bash tests/hooks/test-run-hook-cmd-windows.sh

      - name: Test SessionStart hook
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash tests/hooks/test-session-start.sh

      - name: Test SDD workspace
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash tests/claude-code/test-sdd-workspace.sh

      - name: Test executing-plans helpers
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash tests/claude-code/test-executing-plans-scripts.sh
